<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, DUR = 15;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const names = ['flyer', 'plate', 'L_sextou', 'L_dhavi', 'L_souza', 'L_tag', 'L_date', 'L_ficons', 'L_finfo', 'M_shine'];
const img = {};
let boxes = null;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, d) => clamp((t - a) / d);
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const easeOutBack = (x, s = 1.9) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

// pseudo-aleatório fixo
let seed = 1234567;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const LAMPS = [[335, 590, 120], [770, 585, 120], [205, 770, 115], [895, 760, 118], [160, 950, 110], [925, 965, 112]];
const BULBS = [[398, 505], [225, 592], [143, 662], [80, 742], [32, 832], [8, 935], [14, 1040], [38, 1140], [60, 1240],
               [860, 588], [940, 662], [1005, 745], [1050, 835], [1075, 940], [1068, 1040], [1048, 1140], [1030, 1235]];
const bulbPh = BULBS.map(() => [rnd() * 6.28, 2 + rnd() * 4]);

// faíscas
const SPARKS = [];
for (let i = 0; i < 220; i++) {
  const left = rnd() < .5;
  SPARKS.push({
    b: rnd() * 15.5 - .5, life: .7 + rnd() * 1.1,
    x: left ? 40 + rnd() * 260 : 780 + rnd() * 270, y: 380 + rnd() * 330,
    vx: (left ? -1 : 1) * (60 + rnd() * 380) * (rnd() < .25 ? -1 : 1), vy: -(80 + rnd() * 420),
    len: 10 + rnd() * 26, w: 1.6 + rnd() * 1.8
  });
}

// camadas animadas
function layer(t, name, start, dur, kind) {
  const p = prog(t, start, dur);
  if (p <= 0) return;
  const [x0, y0, x1, y1] = boxes[name.replace('L_', '')];
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  ctx.save();
  let a = 1;
  if (kind === 'pop') {
    const e = easeOutBack(p, 1.6), s = 1.9 - .9 * e;
    a = clamp(p / .3);
    ctx.translate(cx, cy); ctx.rotate((1 - easeOutCubic(p)) * -0.14); ctx.scale(s, s); ctx.translate(-cx, -cy);
    if (p < .5) ctx.filter = `blur(${(1 - p / .5) * 8}px)`;
  } else if (kind === 'left' || kind === 'right') {
    const e = easeOutExpo(p); a = clamp(p / .25);
    ctx.translate((kind === 'left' ? -1 : 1) * 760 * (1 - e), 0);
    if (p < .4) ctx.filter = `blur(${(1 - p / .4) * 6}px)`;
  } else if (kind === 'stretch') {
    const e = easeOutBack(p, 2.2); a = clamp(p / .2);
    ctx.translate(cx, cy); ctx.scale(Math.max(.001, e), 1); ctx.translate(-cx, -cy);
  } else if (kind === 'up') {
    const e = easeOutCubic(p); a = clamp(p / .5);
    ctx.translate(cx, cy + 90 * (1 - e)); ctx.scale(.88 + .12 * easeOutBack(p), .88 + .12 * easeOutBack(p)); ctx.translate(-cx, -cy);
  } else if (kind === 'fade') {
    const e = easeOutCubic(p); a = e; ctx.translate(0, 34 * (1 - e));
  }
  ctx.globalAlpha = a;
  ctx.drawImage(img[name], 0, 0);
  ctx.restore();
}

function glow(x, y, r, color, a) {
  if (a <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color.replace('A', a)); g.addColorStop(.35, color.replace('A', a * .55)); g.addColorStop(1, color.replace('A', 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

// brilho diagonal recortado pelos textos/logo
const shineCv = document.createElement('canvas'); shineCv.width = W; shineCv.height = H;
const sctx = shineCv.getContext('2d');
function shine(t, start, dur) {
  const p = prog(t, start, dur);
  if (p <= 0 || p >= 1) return;
  const x = -400 + easeInOut(p) * (W + 800);
  sctx.clearRect(0, 0, W, H);
  sctx.globalCompositeOperation = 'source-over';
  const g = sctx.createLinearGradient(x - 160, 0, x + 160, 0);
  g.addColorStop(0, 'rgba(255,240,200,0)'); g.addColorStop(.5, 'rgba(255,250,230,.95)'); g.addColorStop(1, 'rgba(255,240,200,0)');
  sctx.save(); sctx.translate(x, H / 2); sctx.transform(1, 0, -0.45, 1, 0, 0); sctx.translate(-x, -H / 2);
  sctx.fillStyle = g; sctx.fillRect(x - 160, 0, 320, H); sctx.restore();
  sctx.globalCompositeOperation = 'destination-in';
  sctx.drawImage(img.M_shine, 0, 0);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .75; ctx.drawImage(shineCv, 0, 0); ctx.restore();
}

function beat(t) {               // pulso a 120 bpm depois da abertura
  if (t < 3.6) return 0;
  const ph = ((t - 3.6) * 2) % 1;
  return Math.exp(-ph * 5);
}

function render(t) {
  ctx.save();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  // câmera
  const intro = easeOutCubic(prog(t, 0, 1.9));
  let cam = 1.2 - .2 * intro + .045 * prog(t, 1.9, 13.1);
  let shx = 0, shy = 0;
  const sk = prog(t, 1.55, .35);
  if (sk > 0 && sk < 1) { const k = (1 - sk) * 7; shx = Math.sin(t * 90) * k; shy = Math.cos(t * 77) * k; }
  ctx.translate(540 + shx, 800 + shy); ctx.scale(cam, cam); ctx.translate(-540, -800);

  // base
  const settled = t >= 4.0;
  ctx.globalAlpha = easeOutCubic(prog(t, 0, .7));
  ctx.drawImage(settled ? img.flyer : img.plate, 0, 0);
  ctx.globalAlpha = 1;

  // ambiente: refletores e lâmpadas
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const on = easeOutCubic(prog(t, .2, 1.2));
  const b = beat(t), side = Math.floor((t - 3.6) * 2) % 2;
  LAMPS.forEach(([x, y, r], i) => {
    const base = .10 + .07 * Math.sin(t * 2.3 + i * 1.7);
    const kick = t >= 3.6 && (i % 2 === side) ? .32 * b : 0;
    glow(x, y, r * 1.35, 'rgba(255,170,70,A)', (base + kick) * on);
  });
  glow(560, 770, 430, 'rgba(255,150,50,A)', (.10 + .06 * Math.sin(t * 1.6) + .08 * b) * on);
  BULBS.forEach(([x, y], i) => {
    const [ph, sp] = bulbPh[i];
    const tw = Math.pow(Math.max(0, Math.sin(t * sp + ph)), 3);
    glow(x, y, 34, 'rgba(255,215,140,A)', (.15 + .55 * tw) * on);
  });
  // feixes de luz
  const beams = [[1010, 70, 26, .55], [940, 40, 18, .4], [160, 210, -28, .35]];
  beams.forEach(([x, y, ang, a], i) => {
    ctx.save(); ctx.translate(x, y); ctx.rotate((ang + 5 * Math.sin(t * .7 + i * 2)) * Math.PI / 180);
    const g = ctx.createLinearGradient(0, 0, 0, 560);
    const aa = a * (.55 + .45 * Math.sin(t * 1.3 + i)) * on;
    g.addColorStop(0, `rgba(255,220,160,0)`); g.addColorStop(.35, `rgba(255,215,150,${aa})`); g.addColorStop(1, 'rgba(255,170,80,0)');
    ctx.fillStyle = g; ctx.filter = 'blur(12px)';
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.lineTo(55, 560); ctx.lineTo(-55, 560); ctx.closePath(); ctx.fill();
    ctx.restore();
  });
  ctx.restore();

  // textos e rodapé (abertura)
  if (!settled) {
    layer(t, 'L_dhavi', 1.50, .70, 'left');
    layer(t, 'L_souza', 1.60, .70, 'right');
    layer(t, 'L_tag', 2.10, .40, 'stretch');
    layer(t, 'L_sextou', .90, .75, 'pop');
    layer(t, 'L_date', 2.40, .60, 'up');
    layer(t, 'L_ficons', 2.85, .55, 'fade');
    layer(t, 'L_finfo', 3.10, .55, 'fade');
  } else {
    // pulso suave no título acompanhando a batida
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .10 * b; ctx.drawImage(img.L_sextou, 0, 0); ctx.restore();
  }

  // brilho de impacto quando o "Sextou" cai
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const imp = prog(t, 1.45, .6);
  if (imp > 0 && imp < 1) glow(555, 1150, 620 * (.6 + .6 * imp), 'rgba(255,170,60,A)', .55 * (1 - imp));
  const fl = prog(t, .25, .9);
  if (fl > 0 && fl < 1) glow(560, 760, 1100, 'rgba(255,200,120,A)', .55 * Math.sin(fl * Math.PI));
  // borda da data pulsando
  if (t > 3) {
    const [x0, y0, x1, y1] = boxes.date;
    ctx.globalAlpha = .25 + .45 * b;
    ctx.strokeStyle = 'rgba(255,150,50,.9)'; ctx.lineWidth = 4; ctx.shadowColor = 'rgba(255,140,40,1)'; ctx.shadowBlur = 26;
    const r = 34; ctx.beginPath(); ctx.roundRect(x0 + 12, y0 + 10, x1 - x0 - 24, y1 - y0 - 20, r); ctx.stroke();
  }
  ctx.restore();

  // faíscas
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const s of SPARKS) {
    const a = t - s.b; if (a < 0 || a > s.life) continue;
    const x = s.x + s.vx * a, y = s.y + s.vy * a + 260 * a * a;
    const vx = s.vx, vy = s.vy + 520 * a, v = Math.hypot(vx, vy);
    const k = 1 - a / s.life, al = Math.min(1, a * 8) * k;
    const g = ctx.createLinearGradient(x, y, x - vx / v * s.len, y - vy / v * s.len);
    g.addColorStop(0, `rgba(255,245,200,${al})`); g.addColorStop(.4, `rgba(255,170,60,${al * .8})`); g.addColorStop(1, 'rgba(255,110,20,0)');
    ctx.strokeStyle = g; ctx.lineWidth = s.w;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - vx / v * s.len, y - vy / v * s.len); ctx.stroke();
  }
  ctx.restore();

  // brilhos passando nos textos e na logo
  shine(t, 1.0, .9);
  shine(t, 4.3, 1.0);
  shine(t, 8.3, 1.0);
  shine(t, 12.3, 1.0);

  ctx.restore();

  // vinheta + abertura do escuro
  const v = ctx.createRadialGradient(540, 900, 500, 540, 900, 1250);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.35)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

window.ready = (async () => {
  boxes = await (await fetch('boxes.json')).json();
  await Promise.all(names.map(n => new Promise(r => { const i = new Image(); i.onload = () => { img[n] = i; r(); }; i.src = n + '.png'; })));
  render(0);
  return true;
})();
window.frame = t => { render(t); return cv.toDataURL('image/jpeg', .94); };
</script>
</body></html>
