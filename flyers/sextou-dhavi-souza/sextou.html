<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/local.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#000;overflow:hidden}
.c{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Montserrat',sans-serif;background:#050302}
.wood{position:absolute;inset:0;background:url(wood_bg.jpg) 0 0/1080px 1920px}
.halo{position:absolute;left:540px;top:800px;width:1300px;height:1300px;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,rgba(255,140,40,.35),rgba(255,110,20,.12) 45%,transparent 75%);mix-blend-mode:screen}

/* aro de refletores */
.ring{position:absolute;left:540px;top:800px;width:960px;height:960px;transform:translate(-50%,-50%);border-radius:50%;
  border:20px solid #1b1410;box-shadow:inset 0 0 0 3px #4a3a2e,0 0 0 3px #3a2c22,0 20px 40px rgba(0,0,0,.6),inset 0 0 60px rgba(0,0,0,.6)}
.ring2{position:absolute;left:540px;top:800px;width:880px;height:880px;transform:translate(-50%,-50%);border-radius:50%;
  border:6px solid #2a1f17;box-shadow:0 0 0 2px #120c08}
.bulb{position:absolute;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,#fffbe6 0 25%,#ffd27a 45%,#ff9a2a 70%,#a44a0c 100%);
  box-shadow:0 0 10px 4px rgba(255,170,60,.85),0 0 30px 10px rgba(255,120,20,.45)}
.lamp{position:absolute;border-radius:50%;transform:translate(-50%,-50%);
  background:
    radial-gradient(circle at 42% 40%,rgba(255,255,255,.85) 0 3%,transparent 7%),
    radial-gradient(circle,#ffffff 0 4%,#ffe7a6 9%,#ffb341 17%,#f2730f 29%,#b9460a 43%,#6a2405 54%,rgba(40,14,3,.98) 60%,transparent 61%),
    repeating-radial-gradient(circle,rgba(255,200,110,0) 0 10px,rgba(255,200,110,.22) 10px 12px),
    radial-gradient(circle,transparent 0 60%,#3c3029 61%,#6b5a4c 64%,#231a14 68%,#0d0907 72%,#2c221b 74%,#0a0705 77%,transparent 78%);
  box-shadow:0 0 80px 26px rgba(255,120,25,.40),inset 0 0 0 4px rgba(0,0,0,.5)}
.blurlamp{position:absolute;border-radius:50%;filter:blur(18px);
  background:radial-gradient(circle,#ffe7a8 0 10%,#ffa23a 30%,#e0600f 55%,rgba(80,25,5,.9) 70%,transparent 72%)}

.shade{position:absolute;left:0;right:0;top:960px;height:960px;
  background:linear-gradient(180deg,rgba(5,3,2,0) 0%,rgba(10,5,2,.75) 18%,rgba(8,4,2,.93) 34%,#070302 60%,#0a0503 100%)}
.logo{position:absolute;top:150px;left:50%;transform:translateX(-50%);width:390px;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.8)) drop-shadow(0 0 24px rgba(255,150,40,.25))}
.artist{position:absolute;left:0;top:0;width:1080px;height:1920px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.6))}

.script{position:absolute;top:1040px;left:0;white-space:nowrap;
  font-family:'Yellowtail',cursive;font-size:300px;line-height:1;
  background:linear-gradient(180deg,#ffc23a 18%,#ff8a1a 48%,#f2421a 72%,#d61f14 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #6e1206) drop-shadow(0 16px 24px rgba(0,0,0,.7))}
.name{position:absolute;top:1248px;left:0;right:0;text-align:center;font-weight:600;font-size:128px;line-height:1;letter-spacing:-5px;
  background:linear-gradient(180deg,#ffffff 0%,#efe7df 55%,#cfc4bb 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 8px 16px rgba(0,0,0,.6))}
.tag{position:absolute;top:1282px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#9b1c12,#7a130b);
  padding:4px 26px 2px;color:#fff;font-weight:800;font-size:34px;letter-spacing:1px;box-shadow:0 6px 14px rgba(0,0,0,.45);white-space:nowrap}

.date{position:absolute;top:1398px;left:50%;transform:translateX(-50%);border:2.5px solid rgba(255,255,255,.9);border-radius:24px;
  padding:6px 28px 8px;display:flex;align-items:baseline;gap:14px;white-space:nowrap;background:rgba(0,0,0,.25)}
.date b{font-weight:400;font-size:66px;color:#fff;letter-spacing:-1px}
.date span{font-weight:500;font-size:34px;color:#fff}
.footer{position:absolute;left:140px;top:1540px;width:805px}
.grain{position:absolute;inset:0;opacity:.16;mix-blend-mode:overlay}
</style></head>
<body><div class="c">
  <div class="wood"></div>
  <div class="halo"></div>

  <div class="ring"></div>
  <div class="ring2"></div>
  <div id="bulbs"></div>

  <!-- refletores (PAR) atrás do artista -->
    <div class="lamp" style="left:205px;top:540px;width:240px;height:240px"></div>
  <div class="lamp" style="left:875px;top:540px;width:240px;height:240px"></div>
  <div class="lamp" style="left:150px;top:860px;width:210px;height:210px"></div>
  <div class="lamp" style="left:930px;top:860px;width:210px;height:210px"></div>

  <div class="shade"></div>
  <img class="logo" src="logo.png">
  <img class="artist" src="dhavi_cut.png">
  <div style="position:absolute;left:0;right:0;top:960px;height:140px;background:linear-gradient(180deg,rgba(7,3,2,0),rgba(7,3,2,.55) 60%,#070302)"></div>

  <div class="script" id="script">Sextou</div>
  <div class="name">DHAVI SOUZA</div>
  <div class="tag">NO RECANTO</div>

  <div class="date"><b>27.NOV</b><span>19H</span></div>
  <img class="footer" src="footer.png">

  <!-- lâmpadas desfocadas em primeiro plano -->
  <div class="blurlamp" style="left:-120px;top:-60px;width:300px;height:300px"></div>
  <div class="blurlamp" style="left:-150px;top:190px;width:260px;height:260px;opacity:.8"></div>
  <div class="blurlamp" style="left:900px;top:1600px;width:320px;height:320px"></div>
  <div class="blurlamp" style="left:930px;top:1380px;width:250px;height:250px;opacity:.8"></div>

  <svg class="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.3 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
<script>
// lâmpadas ao redor do aro
(() => {
  const host = document.getElementById('bulbs'), R = 470, cx = 540, cy = 800;
  for (let i = 0; i < 40; i++) {
    const a = i / 40 * Math.PI * 2, x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
    if (y > 1010) continue;
    if (y < 430 && Math.abs(x - cx) < 230) continue;   // não passa por cima da logo               // parte de baixo fica escondida pelo texto
    const b = document.createElement('div'); b.className = 'bulb'; b.style.left = x + 'px'; b.style.top = y + 'px'; host.appendChild(b);
  }
})();
// centraliza o "Sextou" pela tinta real das letras
window.centerScript = async () => {
  await document.fonts.ready;
  const el = document.getElementById('script'), ctx = document.createElement('canvas').getContext('2d');
  const fs = parseFloat(getComputedStyle(el).fontSize);
  ctx.font = fs + 'px Yellowtail';
  const m = ctx.measureText('Sextou'), ink = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
  el.style.left = ((1080 - ink) / 2 + m.actualBoundingBoxLeft) + 'px';
  return {ink};
};
</script>
</body></html>
