<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/local.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#000;overflow:hidden}
.c{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Montserrat',sans-serif;
  background:linear-gradient(180deg,#120804 0%,#241006 60%,#2a1307 85%,#341809 100%)}
.wood{position:absolute;left:0;top:0;width:1080px;height:1920px;background:url(wood_bg2.jpg) 0 0/1080px 1920px}
.lower{position:absolute;left:0;right:0;top:1020px;height:900px;
  background:linear-gradient(180deg,rgba(40,18,8,0) 0%,rgba(38,17,7,.55) 12%,rgba(40,17,7,.88) 24%,#2a1207 36%,#251006 70%,#2e1408 100%)}
.botglow{position:absolute;inset:0;background:
  radial-gradient(700px 420px at 50% 104%,rgba(200,90,25,.35),transparent 70%),
  radial-gradient(500px 500px at 0% 100%,rgba(150,60,15,.25),transparent 70%),
  radial-gradient(500px 500px at 100% 100%,rgba(150,60,15,.25),transparent 70%)}

.ring{position:absolute;left:540px;top:1000px;border-radius:50%;transform:translate(-50%,-50%)}
.r1{width:1090px;height:1090px;border:16px solid #2a1c14;box-shadow:inset 0 0 0 2px #6a5040,0 0 0 2px #120a06,0 0 30px rgba(0,0,0,.6)}
.r2{width:980px;height:980px;border:8px solid #2c1e15;box-shadow:inset 0 0 0 1px #5e4535,0 0 0 1px #5e4535}
.bulb{position:absolute;width:22px;height:22px;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,#fffbe8 0 28%,#ffd88a 46%,#ff9d32 70%,#a5480c 100%);
  box-shadow:0 0 10px 4px rgba(255,180,70,.9),0 0 34px 12px rgba(255,120,25,.45)}
.par{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
  box-shadow:0 0 90px 30px rgba(255,140,40,.45),0 18px 30px rgba(0,0,0,.55)}
.par img{width:100%;height:100%;display:block;filter:sepia(.55) saturate(1.8) hue-rotate(-8deg) brightness(1.08)}
.par:after{content:"";position:absolute;inset:-30%;border-radius:50%;mix-blend-mode:screen;background:radial-gradient(closest-side,rgba(255,235,170,.85),rgba(255,170,70,.45) 45%,transparent 78%)}
.core{position:absolute;left:545px;top:760px;width:980px;height:900px;opacity:.62;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,rgba(255,214,140,1),rgba(255,165,70,.9) 30%,rgba(240,100,25,.55) 58%,transparent 80%);mix-blend-mode:screen}

.beam{position:absolute;mix-blend-mode:screen;filter:blur(10px);transform-origin:50% 0}
.spark{position:absolute;height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(255,170,60,0),#ffd27a 40%,#fff4d0 60%,rgba(255,170,60,0));
  box-shadow:0 0 6px rgba(255,150,40,.9);mix-blend-mode:screen}
.blurlamp{position:absolute;border-radius:50%;filter:blur(20px);
  background:radial-gradient(circle,#ffe7a8 0 10%,#ffa23a 30%,#d9580f 55%,rgba(80,25,5,.85) 70%,transparent 72%)}

.logo{position:absolute;top:150px;left:50%;transform:translateX(-50%);width:385px;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.8)) drop-shadow(0 0 18px rgba(255,160,60,.25))}
.artist{position:absolute;left:0;top:0;width:1080px;height:1920px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.55))}
.fade{position:absolute;left:0;right:0;top:960px;height:150px;background:linear-gradient(180deg,rgba(38,17,7,0),rgba(38,17,7,.6) 60%,#261107)}

.script{position:absolute;top:1018px;left:0;white-space:nowrap;
  font-family:'Yellowtail',cursive;font-size:282px;line-height:1;
  background:linear-gradient(180deg,#ffd75a 14%,#ffa21f 42%,#ff6a16 64%,#e3261a 88%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #7a1406) drop-shadow(0 14px 22px rgba(0,0,0,.6))}
.name{position:absolute;top:1260px;left:0;right:0;text-align:center;font-weight:600;font-size:120px;line-height:1;letter-spacing:-4px;white-space:nowrap;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.name .d{background:linear-gradient(180deg,#ff5a1e,#e0231a 60%,#b8150f);-webkit-background-clip:text;background-clip:text;color:transparent}
.name .s{background:linear-gradient(180deg,#ffffff,#f1e9e2 60%,#d8cdc4);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{position:absolute;top:1280px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#6a170e,#4e0f08);
  padding:3px 22px 1px;color:#fff;font-weight:700;font-size:29px;letter-spacing:.5px;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.45)}

.date{position:absolute;top:1400px;left:50%;transform:translateX(-50%);border:3px solid #ff8a2e;border-radius:26px;
  padding:6px 30px 9px;display:flex;align-items:baseline;gap:14px;white-space:nowrap;background:rgba(40,16,6,.85);
  box-shadow:0 0 18px rgba(255,120,30,.55),inset 0 0 12px rgba(255,120,30,.25)}
.date b{font-weight:500;font-size:58px;color:#fff;letter-spacing:-1px}
.date span{font-weight:500;font-size:29px;color:#fff}
.footer{position:absolute;left:140px;top:1540px;width:805px}
.grain{position:absolute;inset:0;opacity:.14;mix-blend-mode:overlay}
</style></head>
<body><div class="c">
  <div class="wood"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(900px 900px at 50% 35%,rgba(255,120,30,.28),transparent 70%);mix-blend-mode:screen"></div>

  <!-- feixes de luz -->
  <div class="beam" style="left:1000px;top:110px;width:46px;height:520px;transform:rotate(27deg);filter:blur(6px);background:linear-gradient(180deg,rgba(255,235,180,0),rgba(255,235,180,.85) 35%,rgba(255,190,100,.5) 70%,rgba(255,150,60,0))"></div>
  <div class="beam" style="left:940px;top:60px;width:110px;height:560px;transform:rotate(25deg);filter:blur(16px);background:linear-gradient(180deg,rgba(255,210,140,0),rgba(255,200,120,.45) 40%,rgba(255,150,60,0))"></div>
  <div class="beam" style="left:205px;top:250px;width:40px;height:330px;transform:rotate(-30deg);filter:blur(6px);background:linear-gradient(180deg,rgba(255,230,170,0),rgba(255,225,160,.7) 40%,rgba(255,150,60,0))"></div>

  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div id="bulbs"></div>

  <!-- refletores -->
  <div class="par" style="left:330px;top:600px;width:212px;height:212px"><img src="par.png"></div>
  <div class="par" style="left:760px;top:600px;width:212px;height:212px"><img src="par.png"></div>
  <div class="par" style="left:200px;top:792px;width:206px;height:206px"><img src="par.png"></div>
  <div class="par" style="left:890px;top:780px;width:206px;height:206px"><img src="par.png"></div>
  <div class="par" style="left:172px;top:975px;width:196px;height:196px"><img src="par.png"></div>
  <div class="par" style="left:920px;top:968px;width:196px;height:196px"><img src="par.png"></div>

  <div class="core"></div>
  <div class="core" style="width:620px;height:620px;top:700px;opacity:.38"></div>
  <div id="sparks"></div>
  <div class="lower"></div>
  <div class="botglow"></div>

  <img class="logo" src="logo.png">
  <img class="artist" src="dhavi_cut.png">
  <div class="fade"></div>

  <div class="script" id="script">Sextou</div>
  <div class="name"><span class="d">DHAVI</span> <span class="s">SOUZA</span></div>
  <div class="tag">NO RECANTO</div>

  <div class="date"><b>27.NOV</b><span>19H</span></div>
  <img class="footer" src="footer.png">

  <div class="blurlamp" style="left:-150px;top:-90px;width:330px;height:330px"></div>
  <div class="blurlamp" style="left:-120px;top:170px;width:270px;height:270px;opacity:.85"></div>
  <div class="blurlamp" style="left:-110px;top:900px;width:200px;height:200px;opacity:.55"></div>

  <svg class="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.3 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
<script>
(() => {
  const host = document.getElementById('bulbs'), R = 515, cx = 540, cy = 1000;
  for (let i = 0; i < 44; i++) {
    const a = i / 44 * Math.PI * 2, x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
    if (y > 1090) continue;
    if (y < 430 && Math.abs(x - cx) < 230) continue;
    const b = document.createElement('div'); b.className = 'bulb'; b.style.left = x + 'px'; b.style.top = y + 'px'; host.appendChild(b);
  }
  // faíscas (pseudo-aleatório fixo)
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const sp = document.getElementById('sparks');
  const zones = [[0, 460, 230, 260, 34], [800, 420, 280, 300, 42], [840, 250, 240, 160, 14], [120, 380, 160, 100, 8]];
  for (const [zx, zy, zw, zh, n] of zones) for (let i = 0; i < n; i++) {
    const d = document.createElement('div'); d.className = 'spark';
    const len = 8 + rnd() * 26; d.style.width = len + 'px';
    d.style.left = zx + rnd() * zw + 'px'; d.style.top = zy + rnd() * zh + 'px';
    d.style.transform = `rotate(${-70 + rnd() * 60}deg)`; d.style.opacity = .45 + rnd() * .55;
    sp.appendChild(d);
  }
})();
window.centerScript = async () => {
  await document.fonts.ready;
  const el = document.getElementById('script'), ctx = document.createElement('canvas').getContext('2d');
  const fs = parseFloat(getComputedStyle(el).fontSize);
  ctx.font = fs + 'px Yellowtail';
  const m = ctx.measureText('Sextou'), ink = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
  el.style.left = ((1080 - ink) / 2 + m.actualBoundingBoxLeft) + 'px';
  return {ink};
};
</script>
</body></html>
