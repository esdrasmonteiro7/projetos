<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/local.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#070504;overflow:hidden}
.c{position:relative;width:1080px;height:1920px;overflow:hidden;
  background:
   radial-gradient(900px 700px at 50% 30%, rgba(150,92,30,.40), transparent 70%),
   radial-gradient(700px 500px at 85% 95%, rgba(120,70,20,.35), transparent 70%),
   radial-gradient(600px 500px at 0% 60%, rgba(90,50,15,.30), transparent 70%),
   linear-gradient(180deg,#0d0906 0%,#120c07 45%,#070504 100%);
  font-family:'Montserrat',sans-serif;color:#f3e6c8}
/* wood slats texture */
.wood{position:absolute;inset:0;opacity:.07;
  background:repeating-linear-gradient(90deg,#c98a3d 0 2px,transparent 2px 120px)}
.grain{position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay}
.bokeh{position:absolute;border-radius:50%;filter:blur(var(--b,8px));
  background:radial-gradient(circle,rgba(255,206,120,.9),rgba(212,150,50,.35) 55%,transparent 72%)}
/* frame lines */
.frame{position:absolute;inset:34px;border:1.5px solid rgba(212,170,90,.45);border-radius:6px}
.frame:after{content:"";position:absolute;inset:10px;border:1px solid rgba(212,170,90,.18);border-radius:4px}

.logo{position:absolute;top:92px;left:50%;transform:translateX(-50%);width:330px;
  filter:drop-shadow(0 4px 14px rgba(0,0,0,.6)) drop-shadow(0 0 22px rgba(230,170,70,.18))}

.card{position:absolute;top:390px;left:50%;transform:translateX(-50%);width:820px;height:840px;
  border-radius:44px;padding:5px;
  background:linear-gradient(135deg,#7a4e14,#f7dc8a 22%,#b9862d 45%,#fff0b8 62%,#a8741f 82%,#e9c46a);
  box-shadow:0 40px 90px rgba(0,0,0,.75),0 0 60px rgba(214,160,60,.22)}
.card .in{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:#000}
.card img{width:100%;height:100%;object-fit:cover;object-position:52% 18%;
  filter:contrast(1.06) saturate(1.05) brightness(1.02)}
.card .warm{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,170,70,.06),rgba(0,0,0,0) 40%,rgba(10,6,3,.55) 78%,rgba(10,6,3,.95) 100%)}

.star{position:absolute;filter:drop-shadow(0 22px 26px rgba(0,0,0,.65))}

.script{position:absolute;top:1092px;left:0;right:0;text-align:center;
  font-family:'Great Vibes',cursive;font-size:268px;line-height:1;letter-spacing:-2px;
  background:linear-gradient(180deg,#fff3c4 8%,#f2cf72 36%,#c58f2c 58%,#f7da86 74%,#9c6a1c 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 rgba(60,35,8,.9)) drop-shadow(0 18px 28px rgba(0,0,0,.8))}

.sub{position:absolute;top:1385px;left:0;right:0;text-align:center;font-size:46px;line-height:1.18;font-weight:300;color:#f1e4c6}
.sub b{font-weight:700;color:#e8bf62}
.name{position:absolute;top:1520px;left:0;right:0;text-align:center;
  font-family:'Cinzel',serif;font-weight:700;font-size:84px;letter-spacing:2px;line-height:1;
  background:linear-gradient(180deg,#fff6d2 0%,#f3d17a 40%,#c08a2a 70%,#f5d98a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.7))}
.role{position:absolute;top:1632px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:26px}
.role span{font-weight:600;font-size:30px;letter-spacing:14px;padding-left:14px;color:#e9d3a0}
.role i{display:block;width:120px;height:1.5px;background:linear-gradient(90deg,transparent,#d9a94c)}
.role i.r{background:linear-gradient(270deg,transparent,#d9a94c)}
.role em{display:block;width:10px;height:10px;transform:rotate(45deg);background:#e0b65a}

.pill{position:absolute;top:1740px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:18px;padding:16px 38px;border-radius:999px;
  border:1.5px solid rgba(222,178,90,.75);background:rgba(15,10,6,.75);
  box-shadow:0 0 24px rgba(214,160,60,.18);white-space:nowrap}
.pill svg{width:30px;height:30px}
.pill span{font-weight:500;font-size:26px;letter-spacing:3px;color:#f0dcae}
.pill .sep{width:1.5px;height:26px;background:rgba(222,178,90,.6)}
.pill .st{color:#e2b85c;letter-spacing:4px;font-size:22px}
</style></head>
<body><div class="c">
  <div class="wood"></div>
  <svg class="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.2 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>

  <!-- bokeh lights -->
  <div class="bokeh" style="width:90px;height:90px;left:70px;top:300px;--b:6px;opacity:.55"></div>
  <div class="bokeh" style="width:46px;height:46px;left:190px;top:250px;--b:3px;opacity:.6"></div>
  <div class="bokeh" style="width:130px;height:130px;left:900px;top:230px;--b:12px;opacity:.45"></div>
  <div class="bokeh" style="width:36px;height:36px;left:960px;top:400px;--b:2px;opacity:.7"></div>
  <div class="bokeh" style="width:60px;height:60px;left:110px;top:1460px;--b:5px;opacity:.45"></div>
  <div class="bokeh" style="width:40px;height:40px;left:960px;top:1500px;--b:3px;opacity:.5"></div>
  <div class="bokeh" style="width:420px;height:420px;left:-170px;top:1650px;--b:40px;opacity:.55"></div>
  <div class="bokeh" style="width:300px;height:300px;left:880px;top:-120px;--b:36px;opacity:.35"></div>

  <div class="frame"></div>
  <img class="logo" src="logo.png">

  <div class="card"><div class="in"><img src="foto.jpg"><div class="warm"></div></div></div>

  <!-- gold star balloons -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff4c2"/><stop offset=".25" stop-color="#f1c862"/>
        <stop offset=".55" stop-color="#b47a22"/><stop offset=".8" stop-color="#e9b955"/><stop offset="1" stop-color="#7a4b12"/>
      </linearGradient>
      <radialGradient id="hl" cx=".38" cy=".3" r=".45"><stop offset="0" stop-color="#fffbe8" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <symbol id="star" viewBox="0 0 200 200">
        <path d="M100 8 C108 8 112 50 124 66 C138 80 188 74 192 82 C196 92 152 118 148 136 C144 154 166 192 158 196 C148 200 116 170 100 170 C84 170 52 200 42 196 C34 192 56 154 52 136 C48 118 4 92 8 82 C12 74 62 80 76 66 C88 50 92 8 100 8Z" fill="url(#g1)"/>
        <path d="M100 8 C92 8 88 50 76 66 C62 80 12 74 8 82 C30 86 70 88 86 76 C96 66 98 30 100 8Z" fill="#fff6d0" opacity=".55"/>
        <path d="M100 30 L100 150 M30 86 L100 120 L170 86 M60 180 L100 120 L140 180" stroke="#7a4b12" stroke-opacity=".25" stroke-width="3" fill="none"/>
        <ellipse cx="78" cy="78" rx="30" ry="18" fill="url(#hl)" transform="rotate(-30 78 78)"/>
      </symbol>
    </defs>
  </svg>
  <svg class="star" style="left:40px;top:330px;width:270px;height:270px;transform:rotate(-16deg)"><use href="#star"/></svg>
  <svg class="star" style="left:800px;top:930px;width:240px;height:240px;transform:rotate(14deg)"><use href="#star"/></svg>
  <svg class="star" style="left:860px;top:330px;width:110px;height:110px;transform:rotate(22deg);filter:blur(2px) drop-shadow(0 10px 14px rgba(0,0,0,.6))"><use href="#star"/></svg>

  <div class="script">Parabéns</div>
  <div class="sub"><b>Parabéns</b> pelo<br>seu aniversário!</div>
  <div class="name">Gleicivan Oliveira</div>
  <div class="role"><i></i><em></em><span>GERENTE</span><em></em><i class="r"></i></div>
  <div class="pill">
    <svg viewBox="0 0 24 24" fill="none" stroke="#e2b85c" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1" fill="#e2b85c" stroke="none"/></svg>
    <span>@recantodoguerreiro_parrilla</span>
  </div>
</div></body></html>
