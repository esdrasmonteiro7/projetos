# Render Blueprint — painel Bom Gosto da Amazônia no plano GRÁTIS (sem cartão), com backup automático criptografado no GitHub.
# Como usar: na Render, "New +" → "Blueprint" → escolha este repositório e a branch → preencha os 3 valores pedidos → Apply.
# (Para um disco permanente em vez de backup, veja "Plano pago" no README: troque plan para starter e acrescente o bloco disk.)
services:
  - type: web
    name: bomgosto-painel
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./bom-gosto-amazonia/Dockerfile
    dockerContext: ./bom-gosto-amazonia
    healthCheckPath: /api/sessao
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: TZ
        value: America/Manaus   # fuso da empresa (Belém: America/Belem). Também dá para trocar depois em Configurações.
      - key: SETUP_CODE
        sync: false             # código secreto só seu, para criar o 1º administrador
      - key: BACKUP_GITHUB_REPO
        sync: false             # ex.: seuusuario/bomgosto-backup  (repositório PRIVADO só para os backups)
      - key: BACKUP_GITHUB_TOKEN
        sync: false             # token do GitHub com permissão "Contents: Read and write" nesse repositório
      - key: BACKUP_KEY
        generateValue: true     # senha que criptografa o backup — GUARDE uma cópia (Render → Environment)
