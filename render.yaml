# Render Blueprint — cria o painel Bom Gosto da Amazônia com disco permanente para o banco de dados.
# Como usar: no painel da Render, "New +" → "Blueprint" → escolha este repositório → informe o SETUP_CODE → Apply.
services:
  - type: web
    name: bom-gosto-painel
    runtime: docker
    dockerfilePath: ./bom-gosto-amazonia/Dockerfile
    dockerContext: ./bom-gosto-amazonia
    plan: starter            # precisa ser um plano pago para ter disco permanente (os dados ficam salvos)
    region: virginia
    healthCheckPath: /api/sessao
    autoDeploy: true
    disk:
      name: dados-painel
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: TZ
        value: America/Manaus   # fuso da empresa (Belém: America/Belem). Também dá para trocar depois em Configurações.
      - key: SETUP_CODE
        sync: false             # a Render vai pedir este valor: um código secreto só seu para criar o 1º administrador
